{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="qc-auth-wrap">
  <div class="qc-card p-4 p-md-5" style="max-width:460px;width:100%">
    <div class="text-center mb-4">
      <span class="qc-logo mx-auto mb-3" style="width:52px;height:52px;font-size:1.5rem"><i class="bi bi-lightning-charge-fill"></i></span>
      <h3 class="mb-1">Welcome back</h3>
      <p class="text-secondary small mb-0">Sign in to QuizCloud</p>
    </div>

    <a href="{{ url_for('auth.entra_login') }}" class="btn btn-outline-primary w-100 btn-lg d-flex align-items-center justify-content-center gap-2">
      <i class="bi bi-microsoft"></i>
      <span>Sign in with Microsoft Entra ID</span>
    </a>

    <div class="qc-divider">or sign in with email</div>

    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button class="btn btn-primary w-100 btn-lg">Sign in</button>
    </form>

    <p class="text-secondary small text-center mt-4 mb-0">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-decoration-none">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
