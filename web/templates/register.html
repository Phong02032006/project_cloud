{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="qc-auth-wrap">
  <div class="qc-card p-4 p-md-5" style="max-width:460px;width:100%">
    <div class="text-center mb-4">
      <span class="qc-logo mx-auto mb-3" style="width:52px;height:52px;font-size:1.5rem"><i class="bi bi-person-plus-fill"></i></span>
      <h3 class="mb-1">Create an account</h3>
      <p class="text-secondary small mb-0">Join QuizCloud to take or manage exams</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input name="name" class="form-control" placeholder="Nguyen Van A" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input name="email" type="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" minlength="6" class="form-control" placeholder="At least 6 characters" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm password</label>
        <input name="confirm_password" type="password" minlength="6" class="form-control" placeholder="Re-enter password" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <button class="btn btn-primary w-100 btn-lg">Create account</button>
    </form>

    <p class="text-secondary small text-center mt-4 mb-0">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
